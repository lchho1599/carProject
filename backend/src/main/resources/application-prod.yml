# 운영 설정 — 모든 접속 정보는 환경변수(GCP Secret Manager)로만 주입한다. 기본값을 두지 않는다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  notification:
    from: ${MAIL_FROM}
    admin-base-url: ${ADMIN_BASE_URL}
  security:
    ip-hash-salt: ${IP_HASH_SALT}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
    session-cookie-secure: true

# 운영에서는 API 문서(Swagger)를 노출하지 않는다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: info
    com.rentdb: info
