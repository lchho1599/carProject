# 로컬 개발용 컨테이너 — 운영 서버에는 사용하지 않는다.
# 값은 루트의 .env 파일에서 읽는다 (.env.example 참고).
name: rentdb

services:
  postgres:
    image: postgres:17
    container_name: rentdb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rentdb}
      POSTGRES_USER: ${POSTGRES_USER:-rentdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentdb_local}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      # 설치판 PostgreSQL(5432)과 겹치지 않도록 5433 사용, 이 PC에서만 접속 허용
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: rentdb-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"   # 백엔드가 메일을 보내는 SMTP 포트
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"    # 받은 메일 확인 화면
    environment:
      TZ: Asia/Seoul

volumes:
  postgres-data:
